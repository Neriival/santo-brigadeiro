        <div class="splash-orbit orbit-two" aria-hidden="true"></div>
        <span class="splash-spark spark-1" aria-hidden="true">✦</span>

        <div class="splash-content">

                alt="Santo Brigadeiro"

            <p class="splash-title">Preparando delícias...</p>
