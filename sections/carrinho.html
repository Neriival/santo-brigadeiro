<!-- =========================
     CARRINHO
========================== -->

<div
    class="cart-overlay"
    id="cartOverlay"
>

    <div class="cart">

        <!-- CABEÇALHO -->
        <div class="cart-header">

            <div>
                <span>Seu pedido</span>
                <h2>Meu Carrinho 🛒</h2>
            </div>

            <button
                class="cart-close"
                id="cartClose"
                type="button"
                aria-label="Fechar carrinho"
            >
                ×
            </button>

        </div>


        <!-- PRODUTOS -->
        <div
            class="cart-items"
            id="cartItems"
        ></div>


        <!-- CARRINHO VAZIO -->
        <div
            class="cart-empty"
            id="cartEmpty"
        >

            <div class="cart-empty-icon">
                🛒
            </div>

            <h3>
                Seu carrinho está vazio
            </h3>

            <p>
                Escolha alguma delícia para começar seu pedido.
            </p>

        </div>


        <!-- RESUMO -->
        <div
            class="cart-summary"
            id="cartSummary"
        >

            <div class="cart-summary-row">

                <span>
                    Quantidade
                </span>

                <strong id="cartTotalQuantity">
                    0 itens
                </strong>

            </div>


            <div class="cart-summary-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    R$ 0,00
                </strong>

            </div>


            <button
                class="cart-finish"
                id="cartFinish"
                type="button"
            >
                Continuar pedido →
            </button>

        </div>

    </div>

</div>
