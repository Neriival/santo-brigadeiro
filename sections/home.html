<!-- =========================
     CONTEÚDO PRINCIPAL
========================== -->

<section class="home">

    <!-- SAUDAÇÃO -->
    <div class="home-welcome">

        <span>Olá! 👋</span>

        <h1>
            O que vamos adoçar hoje?
        </h1>

        <p>
            Escolha seus doces favoritos e faça seu pedido.
        </p>

    </div>


    <!-- BUSCA -->
    <div class="search-container">

        <span class="search-icon">⌕</span>

        <input
            type="search"
            id="searchInput"
            placeholder="Buscar no cardápio..."
            autocomplete="off"
        >

    </div>


    <!-- CATEGORIAS -->
    <section class="home-section">

        <div class="section-title">

            <h2>Categorias</h2>

            <button type="button">
                Ver todas
            </button>

        </div>


        <div class="categories">

            <button
                class="category-card active"
                type="button"
                data-category="todos"
            >
                <div class="category-icon">
                    ✨
                </div>

                <span>Todos</span>
            </button>


            <button
                class="category-card"
                type="button"
                data-category="bolos"
            >
                <div class="category-icon">
                    🎂
                </div>

                <span>Bolos</span>
            </button>


            <button
                class="category-card"
                type="button"
                data-category="doces"
            >
                <div class="category-icon">
                    🍫
                </div>

                <span>Doces</span>
            </button>


            <button
                class="category-card"
                type="button"
                data-category="kits"
            >
                <div class="category-icon">
                    🎁
                </div>

                <span>Kits</span>
            </button>


            <button
                class="category-card"
                type="button"
                data-category="salgados"
            >
                <div class="category-icon">
                    🥟
                </div>

                <span>Salgados</span>
            </button>


            <button
                class="category-card"
                type="button"
                data-category="topos"
            >
                <div class="category-icon">
                    🎨
                </div>

                <span>Topos Personalizados</span>
            </button>

        </div>

    </section>


    <!-- DESTAQUES -->
    <section class="home-section">

        <div class="section-title">

            <h2>Destaques</h2>

            <button type="button">
                Ver todos
            </button>

        </div>


        <div
            class="products-grid"
            id="featuredProducts"
        >
            <!-- Produtos inseridos pelo JavaScript -->
        </div>

    </section>

</section>
