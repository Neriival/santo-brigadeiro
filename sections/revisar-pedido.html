<!-- =========================
     REVISAR PEDIDO
========================== -->

<div
    class="review-overlay"
    id="reviewOverlay"
>

    <div class="review">

        <!-- =========================
             CABEÇALHO
        ========================== -->

        <div class="review-header">

            <button
                class="review-back"
                id="reviewBack"
                type="button"
                aria-label="Voltar"
            >
                ←
            </button>


            <div>

                <span>
                    Confira tudo 💙
                </span>

                <h2>
                    Revisar pedido
                </h2>

            </div>


            <button
                class="review-close"
                id="reviewClose"
                type="button"
                aria-label="Fechar"
            >
                ×
            </button>

        </div>


        <!-- =========================
             CONTEÚDO
        ========================== -->

        <div class="review-content">


            <!-- CLIENTE -->

            <section class="review-section">

                <h3>
                    👤 Seus dados
                </h3>


                <div class="review-info">

                    <div class="review-info-row">

                        <span>Nome</span>

                        <strong id="reviewCustomerName">
                            -
                        </strong>

                    </div>


                    <div class="review-info-row">

                        <span>WhatsApp</span>

                        <strong id="reviewCustomerPhone">
                            -
                        </strong>

                    </div>

                </div>

            </section>


            <!-- RECEBIMENTO -->

            <section class="review-section">

                <h3>
                    📦 Recebimento
                </h3>


                <div class="review-info">

                    <div class="review-info-row">

                        <span>Forma</span>

                        <strong id="reviewDeliveryType">
                            -
                        </strong>

                    </div>


                    <!-- ENDEREÇO -->

                    <div
                        class="review-address"
                        id="reviewAddress"
                    >

                        <div class="review-info-row">

                            <span>Bairro</span>

                            <strong id="reviewNeighborhood">
                                -
                            </strong>

                        </div>


                        <div class="review-info-row">

                            <span>Endereço</span>

                            <strong id="reviewStreet">
                                -
                            </strong>

                        </div>


                        <div
                            class="review-info-row"
                            id="reviewComplementRow"
                        >

                            <span>Complemento</span>

                            <strong id="reviewComplement">
                                -
                            </strong>

                        </div>

                    </div>

                </div>

            </section>


            <!-- DATA E HORÁRIO -->

            <section class="review-section">

                <h3>
                    📅 Data e horário
                </h3>


                <div class="review-info">

                    <div class="review-info-row">

                        <span>Data</span>

                        <strong id="reviewDate">
                            -
                        </strong>

                    </div>


                    <div class="review-info-row">

                        <span>Horário</span>

                        <strong id="reviewTime">
                            -
                        </strong>

                    </div>

                </div>

            </section>


            <!-- PAGAMENTO -->
            <section class="review-section">
                <h3>💳 Pagamento</h3>
                <div class="review-info">
                    <div class="review-info-row"><span>Forma</span><strong id="reviewPaymentMethod">-</strong></div>
                    <div class="review-info-row" id="reviewChangeRow" hidden><span>Troco para</span><strong id="reviewChangeFor">-</strong></div>
                </div>
            </section>

            <!-- PRODUTOS -->

            <section class="review-section">

                <h3>
                    🛍️ Seu pedido
                </h3>


                <div
                    class="review-products"
                    id="reviewProducts"
                >
                </div>

            </section>


            <!-- OBSERVAÇÃO -->

            <section
                class="review-section"
                id="reviewObservationSection"
            >

                <h3>
                    📝 Observação
                </h3>


                <div class="review-observation">

                    <p id="reviewObservation">
                        -
                    </p>

                </div>

            </section>


            <!-- =========================
                 VALORES
            ========================== -->

            <section class="review-values">


                <div class="review-value-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="reviewSubtotal">
                        R$ 0,00
                    </strong>

                </div>


                <div
                    class="review-value-row"
                    id="reviewDeliveryFeeRow"
                >

                    <span>
                        Taxa de entrega
                    </span>

                    <strong id="reviewDeliveryFee">
                        R$ 0,00
                    </strong>

                </div>


                <div class="review-total">

                    <span>
                        Total
                    </span>

                    <strong id="reviewTotal">
                        R$ 0,00
                    </strong>

                </div>

            </section>


            <!-- =========================
                 BOTÕES
            ========================== -->

            <div class="review-actions">


                <button
                    class="review-edit"
                    id="reviewEdit"
                    type="button"
                >
                    ← Editar dados
                </button>


                <button
                    class="review-whatsapp"
                    id="reviewWhatsapp"
                    type="button"
                >

                    <span>
                        💬
                    </span>

                    Enviar pedido pelo WhatsApp

                </button>


            </div>

        </div>

    </div>

</div>
